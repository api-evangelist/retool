- aid: retool:retool-scim-api
  name: Retool SCIM 2.0 API
  description: Retool implements a subset of the SCIM 2.0 API for automated user provisioning and group mapping through identity providers like
    Okta and Azure Active Directory (Entra ID). Available on Enterprise plan.
  humanURL: https://docs.retool.com/org-users/concepts/scim
