- aid: retool:retool-platform
  name: Retool Platform
  description: Retool's low-code platform provides a visual development environment with 100+ pre-built components, native connectors to 70+ data
    sources, AI-powered app generation (AppGen), workflow automation, built-in database, and mobile app support. Supports self-hosted and cloud
    deployment options with ISO 27001 and SOC 2 compliance.
